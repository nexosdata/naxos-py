[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "naxosdata"
version = "1.4.0"
description = "Official Python SDK for NaxosData tick archive & institutional prediction market API"
readme = "README.md"
authors = [{ name = "NaxosData Quant Engineering", email = "hello@naxosdata.com" }]
license = { text = "MIT" }
keywords = ["prediction-markets", "polymarket", "kalshi", "arbitrage", "orderbook", "financial-data"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28.0",
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
backtest = [
    "pandas>=1.5.0",
    "pyarrow>=10.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.20.0",
    "twine>=4.0.0",
    "build>=0.10.0",
]

[project.urls]
Homepage = "https://naxosdata.com"
Documentation = "https://naxosdata.com/docs"
Repository = "https://github.com/nexosdata/naxos-py"
